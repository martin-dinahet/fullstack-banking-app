name: mybank

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - mybank-internal

  backend:
    build:
      context: ./backend
      args:
        APP_ENV: prod
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
    volumes:
      - ./deploy/runtime/jwt:/var/www/html/config/jwt
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybank-internal

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mybank-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - mybank-internal

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.mybank.rule=Host(`${MYBANK_HOST}`)
      - traefik.http.routers.mybank.entrypoints=websecure
      - traefik.http.routers.mybank.tls=true
      - traefik.http.routers.mybank.tls.certresolver=letsencrypt
      - traefik.http.routers.mybank-http.rule=Host(`${MYBANK_HOST}`)
      - traefik.http.routers.mybank-http.entrypoints=web
      - traefik.http.routers.mybank-http.middlewares=https-redirect
      - traefik.http.services.mybank.loadbalancer.server.port=80
    networks:
      - mybank-internal
      - proxy

volumes:
  mybank-db-data:

networks:
  mybank-internal:
    driver: bridge
  proxy:
    external: true
